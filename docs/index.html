<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>房车比价通 · 二手房车聚合比价</title>
<meta name="description" content="聚合房车猫、21世纪房车、舒旅二手房车网三源在售二手房车，支持筛选、同款比价与行情统计。">
<style>
:root{
  --blue:#1e3a5f; --accent:#e67e22; --bg:#f4f6f8; --card:#fff;
  --line:#e3e8ee; --text:#222; --muted:#7a8494;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding-bottom:64px}
a{color:inherit;text-decoration:none}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,#1e3a5f,#2c5688);color:#fff;padding:12px 16px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.top h1{font-size:clamp(17px,4.5vw,22px);font-weight:700;display:flex;align-items:center;gap:8px}
.top h1 .dot{width:9px;height:9px;border-radius:50%;background:#7fd1a0;display:inline-block}
.src-line{font-size:12px;opacity:.85;margin-top:4px}
.searchbar{display:flex;gap:8px;margin-top:10px}
.searchbar input{flex:1;border:none;border-radius:20px;padding:9px 14px;font-size:14px;background:#fff;color:#222}
.searchbar button{border:none;border-radius:20px;padding:0 16px;background:var(--accent);color:#fff;font-size:14px}
.navtab{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.navtab a{flex:1;text-align:center;padding:10px 0 8px;font-size:12px;color:var(--muted)}
.navtab a.active{color:var(--accent);font-weight:600}
.navtab a i{display:block;font-style:normal;font-size:19px;line-height:1;margin-bottom:3px}
.wrap{max-width:1200px;margin:0 auto;padding:14px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.filters select,.filters input{font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#333;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{font-size:12px;padding:5px 11px;border:1px solid var(--line);border-radius:20px;background:#fff;color:#555;cursor:pointer}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.count{font-size:12px;color:var(--muted);margin-bottom:10px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:box-shadow .15s}
.card:hover{box-shadow:0 6px 18px rgba(30,58,95,.12)}
.card .thumb{height:120px;background:linear-gradient(120deg,#dfe5ec,#eef1f4);position:relative}
.card .thumb img{width:100%;height:100%;object-fit:cover}
.srctag{position:absolute;top:8px;left:8px;font-size:11px;padding:3px 8px;border-radius:6px;color:#fff}
.card .body{padding:10px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .t{font-size:14px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.card .meta{font-size:12px;color:var(--muted)}
.card .btm{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.price{color:#d23b2e;font-weight:700;font-size:18px}
.price small{font-size:12px;font-weight:400;color:#d23b2e}
.sale{font-size:12px;color:#4a9}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.panel h2{font-size:16px;margin-bottom:10px;color:var(--blue)}
.field{display:flex;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
.field:last-child{border-bottom:none}
.field .k{width:84px;color:var(--muted);flex-shrink:0}
.field .v{flex:1;word-break:break-word}
.desc{font-size:13px;line-height:1.7;color:#444;margin-top:4px;white-space:pre-wrap}
.back{display:inline-block;margin-bottom:10px;font-size:13px;color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;white-space:nowrap}
th{background:#eef2f6;color:var(--blue);position:sticky;top:0}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid var(--line)}
.stat-row{display:flex;align-items:center;gap:10px;font-size:13px;margin:7px 0}
.stat-row .lab{width:96px;color:var(--muted);flex-shrink:0;text-align:right}
.stat-row .bar{height:16px;border-radius:4px;background:linear-gradient(90deg,#3a6ea5,#1e3a5f)}
.stat-row .num{min-width:54px;color:#555}
.empty{padding:40px;text-align:center;color:var(--muted)}
@media (min-width:822px){ .navtab{top:auto;height:auto} }
@media (max-width:560px){
  body{padding-bottom:60px}
  .filters{flex-direction:column}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .card .thumb{height:96px}
  .card .t{font-size:13px;min-height:36px}
}
@media (min-width:561px) and (max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<header class="top">
  <h1><span class="dot"></span>房车比价通</h1>
  <div class="src-line">聚合 3 源在售二手房车 · 数据快照，定期自动刷新</div>
  <div class="searchbar">
    <input id="kw" placeholder="搜索：品牌 / 车型 / 关键词" onkeydown="if(event.key==='Enter')applySearch()">
    <button onclick="applySearch()">搜索</button>
  </div>
</header>

<div class="wrap">
  <div id="kwbar" class="chips" style="display:none"></div>

  <div class="filters" id="filterPanel">
    <select id="f_src" onchange="applyFilters()"><option value="">全部来源</option></select>
    <select id="f_type" onchange="applyFilters()"><option value="">全部类型</option></select>
    <select id="f_brand" onchange="applyFilters()"><option value="">全部底盘品牌</option></select>
    <select id="f_year" onchange="applyFilters()"><option value="">全部年份</option></select>
    <input id="f_pmin" type="number" placeholder="最低价(万)" onchange="applyFilters()">
    <input id="f_pmax" type="number" placeholder="最高价(万)" onchange="applyFilters()">
    <select id="f_sort" onchange="applyFilters()">
      <option value="">默认排序</option>
      <option value="price_asc">价格最低</option>
      <option value="price_desc">价格最高</option>
      <option value="year_desc">年份最新</option>
    </select>
  </div>

  <!-- 列表 -->
  <div id="viewList"><div class="count" id="countLine">加载中…</div><div class="grid" id="gridList"></div></div>

  <!-- 详情 -->
  <div id="viewDetail" style="display:none">
    <a class="back" href="javascript:void(0)" onclick="goList()">← 返回列表</a>
    <div id="detailBox"></div>
    <div class="panel" style="margin-top:14px"><h2>同款在售对比</h2><div id="sameBox"></div></div>
  </div>

  <!-- 同款比价 -->
  <div id="viewCompare" style="display:none"></div>

  <!-- 行情统计 -->
  <div id="viewStats" style="display:none"></div>
</div>

<nav class="navtab">
  <a href="javascript:void(0)" id="tabList" class="active" onclick="switchView('list')"><i>🚐</i>车源</a>
  <a href="javascript:void(0)" id="tabCompare" onclick="switchView('compare')"><i>⚖️</i>同款比价</a>
  <a href="javascript:void(0)" id="tabStats" onclick="switchView('stats')"><i>📊</i>行情</a>
</nav>

<script src="data.js"></script>
<script>
var DATA=window.RV_DATA||[];
var SOURCES={rv28:{name:'房车猫',color:'#3a6ea5'},'21rv':{name:'21世纪房车',color:'#e67e22'},cn2rv:{name:'舒旅二手房车网',color:'#2e9e5b'}};
var state={view:'list',kw:'',f:{src:'',type:'',brand:'',year:'',pmin:'',pmax:'',sort:''},sort:'',tid:null};

function srcName(c){var s=SOURCES[c];return s?s.name:c}
function flat(n){return n==null?'-':n}
function fmtP(p){return p?('¥'+p.toLocaleString('zh-CN',{minimumFractionDigits:1,maximumFractionDigits:1})):'面议'}
function fmtM(km){return km==null?'-':(km>=10000?(km/10000).toFixed(1)+'万公里':km+'公里')}
function srcTag(r){var s=SOURCES[r.source]||{name:r.source,color:'#8a93a3'};return '<span class="srctag" style="background:'+s.color+'">'+s.name+'</span>'}

function rangeYear(r){ // 从 reg_year / reg_date 取年份
  var y=r.reg_year;
  if(y)return y;
  var m=String(r.reg_date).match(/(\d{4})/);return m?+m[1]:null;
}
function matches(r,f){
  if(f.src&&r.source!==f.src)return false;
  if(f.type&&r.rv_type!==f.type)return false;
  if(f.brand&&r.chassis_brand!==f.brand)return false;
  var y=rangeYear(r);
  if(f.year&&(y===null||y!==+f.year))return false;
  if(f.pmin!=='' && (r.price==null||r.price<+f.pmin))return false;
  if(f.pmax!=='' && (r.price!=null&&r.price>+f.pmax))return false;
  if(state.kw){
    var k=state.kw.toLowerCase();
    var hay=(r.title+' '+(r.brand||'')+' '+(r.chassis_model||'')).toLowerCase();
    if(hay.indexOf(k)<0)return false;
  }
  return true;
}
function filtered(){
  var arr=DATA.filter(function(r){return matches(r,state.f)});
  var s=state.f.sort;
  if(s==='price_asc')arr.sort(function(a,b){return (a.price||1e9)-(b.price||1e9)});
  else if(s==='price_desc')arr.sort(function(a,b){return (b.price||0)-(a.price||0)});
  else if(s==='year_desc')arr.sort(function(a,b){(rangeYear(b)-rangeYear(a))||((a.price||0)-(b.price||0));});
  return arr;
}

function initFilters(){
  var sets={type:new Set(),brand:new Set(),year:new Set(),src:Object.keys(SOURCES)};
  DATA.forEach(function(r){
    if(r.rv_type)sets.type.add(r.rv_type);
    if(r.chassis_brand)sets.brand.add(r.chassis_brand);
    var y=rangeYear(r);if(y)sets.year.add(y);
  });
  function fill(id,vals,labels){
    var sel=document.getElementById(id);var html='<option value="">'+sel.options[0].text+'</option>';
    vals.forEach(function(v,i){
      var vv=labels?labels[i]:v;var t=String(vv);
      html+='<option value="'+t.replace(/"/g,'&quot;')+'" '+(state.f[id.slice(2)]===t?'selected':'')+'>'+t+'</option>';
    });
    sel.innerHTML=html;
  }
  fill('f_src',Object.keys(SOURCES).sort(),Object.keys(SOURCES).sort().map(srcName));
  fill('f_type',Array.from(sets.type).sort());
  fill('f_brand',Array.from(sets.brand).sort());
  fill('f_year',Array.from(sets.year).sort(function(a,b){return b-a}));
}
function applyFilters(){
  state.f.src=document.getElementById('f_src').value;
  state.f.type=document.getElementById('f_type').value;
  state.f.brand=document.getElementById('f_brand').value;
  state.f.year=document.getElementById('f_year').value;
  state.f.pmin=document.getElementById('f_pmin').value;
  state.f.pmax=document.getElementById('f_pmax').value;
  state.f.sort=document.getElementById('f_sort').value;
  renderList();
}
function applySearch(){state.kw=document.getElementById('kw').value.trim();renderList();}
function goList(){state.tid=null;switchView('list');}

function renderList(){
  var arr=filtered();
  document.getElementById('countLine').textContent='共 '+arr.length+' 台在售'+(SOURCES[state.f.src]?' · 来源 '+SOURCES[state.f.src].name:'');
  var kws=document.getElementById('kwbar');
  if(state.kw){kws.style.display='flex';kws.innerHTML='<span class="chip on">“'+state.kw+'” ×</span>';}
  else kws.style.display='none';
  var box=document.getElementById('gridList');
  if(!arr.length){box.innerHTML='<div class="empty">暂无符合条件的车源</div>';return}
  box.innerHTML=arr.map(function(r){
    var img=r.image_url?'<img src="'+r.image_url+'" loading="lazy" onerror="this.style.display=\'none\'">':'';
    var tags=(r.tags||'').split('、').filter(Boolean).map(function(t){return ' · '+t}).join('');
    return '<div class="card" onclick="openDetail(\''+r.tid+'\')">'
      +'<div class="thumb">'+srcTag(r)+img+'</div>'
      +'<div class="body">'
      +'  <div class="t">'+r.title+'</div>'
      +'  <div class="meta">'+(r.rv_type||'')+(r.location?' · '+r.location:'')+tags+'</div>'
      +'  <div class="btm"><span class="price">'+fmtP(r.price)+'</span><span class="sale">'+flat(rangeYear(r))+'年 · '+fmtM(r.mileage_km)+'</span></div>'
      +'</div></div>';
  }).join('');
}

function openDetail(tid){
  var r=DATA.find(function(x){return x.tid===tid});if(!r)return;
  state.tid=tid;state.view='detail';
  showView('detail');
  var row='<span class="k">来源</span><span class="v">'+srcName(r.source)+'</span>';
  var fields=[
    ['挂牌价',fmtP(r.price)],['上牌年份',rangeYear(r)||'-'],
    ['上牌时间',r.reg_date||'-'],['行驶里程',fmtM(r.mileage_km)],
    ['排放标准',r.emission||'-'],['过户次数',r.transfer_count||'-'],
    ['使用性质',r.usage_type||'-'],['所在地',r.location||'-'],
    ['底盘品牌',r.chassis_brand||'-'],['底盘型号',r.chassis_model||'-'],
    ['上装品牌',r.brand||'-'],['车型类型',r.rv_type||'-']
  ];
  document.getElementById('detailBox').innerHTML=
    '<div class="panel"><h2>'+r.title+'</h2>'+
    fields.map(function(f){return '<div class="field"><span class="k">'+f[0]+'</span><span class="v">'+f[1]+'</span></div>'}).join('')+
    (r.description?'<div class="desc">'+r.description+'</div>':'')+
    (r.url?'<div style="margin-top:10px"><a style="color:#3a6ea5" href="'+r.url+'" target="_blank" rel="noopener">在'+srcName(r.source)+'查看原文 ↗</a></div>':'')+
    '</div>';
  renderSame(r);
}
function renderSame(cur){
  var cm=cur.chassis_model;var box=document.getElementById('sameBox');
  if(!cm){box.innerHTML='<div class="empty">该车未识别出底盘型号，无法聚合同款</div>';return}
  var arr=DATA.filter(function(r){return r.chassis_model===cm&&r.price!=null});
  arr.sort(function(a,b){return (b.price||0)-(a.price||0)});
  box.innerHTML='<div class="tblwrap" id="sameTbl"></div>';
  var min=Math.min.apply(null,arr.map(function(x){return x.price})),max=Math.max.apply(null,arr.map(function(x){return x.price}));
  var avg=arr.reduce(function(s,x){return s+x.price},0)/arr.length;
  var s='<div class="count">同底盘「'+cm+'」共 '+arr.length+' 台 · 最低 ¥'+min.toFixed(1)+'万 / 均价 ¥'+avg.toFixed(1)+'万 / 最高 ¥'+max.toFixed(1)+'万</div>';
  s+='<table><tr><th>车源</th><th>来源</th><th>品牌</th><th>年份</th><th>里程</th><th>所在地</th><th>价格(万)</th></tr>';
  arr.forEach(function(x){
    if(x.tid===cur.tid)s+='<tr style="background:#fff3ec"><td>'+x.title+'（当前）</td><td>'+srcName(x.source)+'</td><td>'+(x.brand||'-')+'</td><td>'+(rangeYear(x)||'-')+'</td><td>'+fmtM(x.mileage_km)+'</td><td>'+(x.location||'-')+'</td><td style="white-space:nowrap">¥'+x.price.toFixed(1)+'万</td></tr>';
    else s+='<tr><td><a href="javascript:void(0)" onclick="openDetail(\''+x.tid+'\')">'+x.title+'</a></td><td>'+srcName(x.source)+'</td><td>'+(x.brand||'-')+'</td><td>'+(rangeYear(x)||'-')+'</td><td>'+fmtM(x.mileage_km)+'</td><td>'+(x.location||'-')+'</td><td style="white-space:nowrap">'+x.price.toFixed(1)+'万</td></tr>';
  });
  s+='</table>';
  document.getElementById('sameTbl').innerHTML=s;
}

function renderCompare(){
  var groups={};
  DATA.forEach(function(r){if(r.chassis_model&&r.price!=null){groups[r.chassis_model]=groups[r.chassis_model]||[];groups[r.chassis_model].push(r)}});
  var keys=Object.keys(groups).sort(function(a,b){
    var d=groups[b].length-groups[a].length;return d||a.localeCompare(b,'zh');
  });
  var html='<div class="panel"><h2>同款比价（按底盘型号聚合）</h2><div class="tblwrap"><table><tr><th>底盘型号</th><th>车源数</th><th>品牌数</th><th>年份范围</th><th>最低(万)</th><th>均价(万)</th><th>最高(万)</th></tr>';
  if(!keys.length)html+='<tr><td colspan="7">暂无数据</td></tr>';
  keys.forEach(function(m){
    var a=groups[m],y=Math.min.apply(null,a.map(rangeYear).filter(Boolean)),y2=Math.max.apply(null,a.map(rangeYear).filter(Boolean));
    var ps=a.map(function(x){return x.price}).sort(function(p,q){return p-q});
    var avg=ps.reduce(function(s,p){return s+p},0)/ps.length;
    var brands={};a.forEach(function(x){if(x.brand)brands[x.brand]=1});
    html+='<tr><td style="font-weight:600"><a href="javascript:void(0)" onclick="openCompareGroup(\''+m.replace(/'/g,'\\\'')+'\')">'+m+'</a></td><td>'+a.length+'</td><td>'+(Object.keys(brands).length)+'</td><td>'+(Number.isFinite(y)?y:'-')+'–'+(Number.isFinite(y2)?y2:'-')+'</td><td>'+ps[0].toFixed(1)+'</td><td>'+avg.toFixed(1)+'</td><td>'+ps[ps.length-1].toFixed(1)+'</td></tr>';
  });
  html+='</table></div></div>';
  document.getElementById('viewCompare').innerHTML=html;
}
function openCompareGroup(m){renderCompareDetail(m);}
function renderCompareDetail(m){
  var arr=DATA.filter(function(r){return r.chassis_model===m&&r.price!=null}).sort(function(a,b){return (b.reg_year||0)-(a.reg_year||0)});
  var brands={};arr.forEach(function(r){if(r.brand)brands[r.brand]=1});
  var ids={'f_src':0};
  var bl='<select id="cbrand" onchange="renderCompareDetail(\''+m.replace(/'/g,'\\\'')+'\')"><option value="">全部品牌</option>';
  Object.keys(brands).sort().forEach(function(b){bl+='<option value="'+b+'">'+b+'</option>'});
  bl+='</select>';
  var yl='<select id="cyear" onchange="renderCompareDetail(\''+m.replace(/'/g,'\\\'')+'\')"><option value="">全部年份</option>';
  Array.from(new Set(arr.map(rangeYear).filter(Boolean))).sort(function(a,b){return b-a}).forEach(function(y){yl+='<option value="'+y+'">'+y+'年</option>'});
  yl+='</select>';
  var cb=document.getElementById('cbrand'),cy=document.getElementById('cyear');
  var bf=cb?cb.value:'',yf=cy?cy.value:'';
  var list=arr.filter(function(r){return (!bf||r.brand===bf)&&(!yf||rangeYear(r)===+yf)});
  var ps=list.map(function(r){return r.price});var min=Math.min.apply(null,ps),max=Math.max.apply(null,ps),avg=ps.reduce(function(s,p){return s+p},0)/ps.length;
  document.getElementById('viewCompare').innerHTML=
    '<a class="back" href="javascript:void(0)" onclick="switchView(\'compare\')">← 全部车型</a>'+
    '<div class="panel"><h2>「'+m+'」同款比价</h2>'
    +'<div class="chips">'+bl+yl+'</div>'
    +'<div class="count">该组 '+arr.length+' 台 · 筛选后 '+list.length+' 台 · 最低 ¥'+min.toFixed(1)+'万 / 均价 ¥'+avg.toFixed(1)+'万 / 最高 ¥'+max.toFixed(1)+'万</div>'
    +'<div class="tblwrap"><table><tr><th>车源</th><th>来源</th><th>上装品牌</th><th>年份</th><th>里程</th><th>所在地</th><th>价格(万)</th></tr>'
    +list.map(function(x){return '<tr><td>'+x.title+'</td><td>'+srcName(x.source)+'</td><td>'+(x.brand||'-')+'</td><td>'+(rangeYear(x)||'-')+'</td><td>'+fmtM(x.mileage_km)+'</td><td>'+(x.location||'-')+'</td><td style="white-space:nowrap">'+x.price.toFixed(1)+'万</td></tr>'}).join('')
    +'</table></div></div>';
}

function renderStats(){
  var h=[0,10,20,30,50,100,1e9];var hl=['0-10万','10-20万','20-30万','30-50万','50-100万','100万+'];
  var ph=h.map(function(){return 0});DATA.forEach(function(r){if(r.price!=null){for(var i=0;i<h.length;i++)if(r.price>=h[i]&&r.price<h[i+1]){ph[i]++;break}}});
  var mh=Math.max.apply(null,ph)||1;
  var type={},brand={},src={};
  DATA.forEach(function(r){if(r.rv_type)type[r.rv_type]=(type[r.rv_type]||0)+1;if(r.chassis_brand)brand[r.chassis_brand]=(brand[r.chassis_brand]||0)+1;src[srcName(r.source)]=(src[srcName(r.source)]||0)+1});
  var sortByNum=function(o){return Object.keys(o).sort(function(a,b){return o[b]-o[a]})};
  var html='<div class="panel"><h2>价格区间分布</h2>'+ph.map(function(n,i){var w=Math.round(n/mh*100);return '<div class="stat-row"><span class="lab">'+hl[i]+'</span><span class="bar" style="width:'+Math.max(2,w)+'%"></span><span class="num">'+n+'台</span></div>'}).join('')+'</div>';
  html+='<div class="panel"><h2>车辆类型</h2>'+sortByNum(type).map(function(k){return '<div class="stat-row"><span class="lab">'+k+'</span><span class="bar" style="width:'+Math.round(type[k]/DATA.length*100)+'%"></span><span class="num">'+type[k]+'台</span></div>'}).join('')+'</div>';
  html+='<div class="panel"><h2>底盘品牌 TOP'+Math.min(10,brand.length?sortByNum(brand).length:0)+'</h2>'+sortByNum(brand).slice(0,10).map(function(k){return '<div class="stat-row"><span class="lab">'+k+'</span><span class="bar" style="width:'+Math.round(brand[k]/DATA.length*100)+'%"></span><span class="num">'+brand[k]+'台</span></div>'}).join('')+'</div>';
  html+='<div class="panel"><h2>数据来源</h2>'+sortByNum(src).map(function(k){return '<div class="stat-row"><span class="lab">'+k+'</span><span class="bar" style="width:'+Math.round(src[k]/DATA.length*100)+'%"></span><span class="num">'+src[k]+'台</span></div>'}).join('')+'</div>';
  document.getElementById('viewStats').innerHTML=html;
}

function showView(v){
  ['list','detail','compare','stats'].forEach(function(x){document.getElementById(x==='list'?'viewList':'view'+cap(x)).style.display=(x===v?'':'none')});
  ['tabList','tabCompare','tabStats'].forEach(function(id){document.getElementById(id).className=(id==='tab'+cap(v)&&v!=='detail')?'active':''});
  document.querySelector('.navtab').style.display=(v==='detail')?'none':'';
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function switchView(v){
  state.view=v;
  if(v==='compare')renderCompare();
  if(v==='stats')renderStats();
  showView(v);
  if(v==='list'){renderList()}
}
initFilters();renderList();
</script>
</body>
</html>
