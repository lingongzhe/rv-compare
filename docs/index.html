<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>房车比价通 · 二手房车聚合比价</title>
<meta name="description" content="聚合房车猫、21世纪房车、舒旅二手房车网三源在售二手房车，支持筛选、同款比对与品牌速览。">
<meta name="theme-color" content="#1e3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --blue:#1e3a5f; --accent:#e67e22; --bg:#f4f6f8; --card:#fff;
  --line:#e3e8ee; --text:#222; --muted:#7a8494;
  --red:#d23b2e;
  --navh:60px;                     /* 底部导航高度 */
  --safe:env(safe-area-inset-bottom,0px);   /* iPhone 底部安全区 */
  --safeT:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);
  padding-bottom:calc(var(--navh) + var(--safe));
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
img{max-width:100%}

/* ---------- 顶栏 ---------- */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,#1e3a5f,#2c5688);color:#fff;
  padding:calc(10px + var(--safeT)) 14px 10px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.top .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{font-size:clamp(16px,4.4vw,22px);font-weight:700;display:flex;align-items:center;gap:8px}
.top h1 .dot{width:9px;height:9px;border-radius:50%;background:#7fd1a0;display:inline-block;flex:0 0 auto}
.upd{font-size:11px;background:rgba(255,255,255,.16);padding:4px 9px;border-radius:14px;white-space:nowrap}
.src-line{font-size:12px;opacity:.85;margin-top:4px}
.src-line b{font-weight:600;color:#ffd9b0}
.searchbar{display:flex;gap:8px;margin-top:10px;position:relative}
.searchbar input{flex:1;border:none;border-radius:20px;padding:9px 34px 9px 14px;font-size:14px;background:#fff;color:#222;min-width:0}
.searchbar .clr{position:absolute;left:0;top:0;height:100%;width:34px;display:none;align-items:center;justify-content:center;
  color:#98a2b3;background:none;border:none;font-size:15px}
.searchbar.has-kw .clr{display:flex}
.searchbar button{border:none;border-radius:20px;padding:0 16px;background:var(--accent);color:#fff;font-size:14px;flex:0 0 auto}

/* ---------- 数据源健康提示 ---------- */
.srchealth{margin-bottom:10px;border-radius:12px;border:1px solid #ffd9a8;background:#fff8ec;padding:10px 12px;font-size:12.5px;line-height:1.6}
.srchealth .sh-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.srchealth b{color:#b35c00}
.srchealth .sh-x{border:none;background:none;color:var(--muted);font-size:14px;padding:0 2px;flex:0 0 auto}
.srchealth ul{margin:6px 0 0 16px;color:#6b5a3e}
.srchealth .sh-ok{margin-top:6px;color:var(--muted);font-size:12px}

/* ---------- 底部导航 ---------- */
.navtab{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);
  z-index:30;padding-bottom:var(--safe)}
.navtab a{flex:1;text-align:center;padding:9px 0 7px;font-size:12px;color:var(--muted)}
.navtab a.active{color:var(--accent);font-weight:600}
.navtab a i{display:block;font-style:normal;font-size:19px;line-height:1;margin-bottom:3px}
.topnav{display:none;margin-top:10px;gap:6px}
.topnav a{padding:7px 16px;border-radius:18px;font-size:13px;color:#c9d7e8;cursor:pointer}
.topnav a:hover{background:rgba(255,255,255,.14)}
.topnav a.active{background:#fff;color:var(--blue);font-weight:600}

.wrap{max-width:1200px;margin:0 auto;padding:12px}

/* ---------- 筛选 ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.fhead{display:none}
.fbody{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 100%}
.filters select,.filters input{font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#333;max-width:100%}
.filters .clearall{margin-left:auto;font-size:12px;border:1px solid var(--red);color:var(--red);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
.filters .clearall:active{background:#fdeeea}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.chip{font-size:12px;padding:5px 11px;border:1px solid var(--line);border-radius:20px;background:#fff;color:#555;cursor:pointer}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.count{font-size:12px;color:var(--muted);margin-bottom:10px}

/* ---------- 车源卡片 ---------- */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;
  display:flex;flex-direction:column;transition:box-shadow .15s,transform .1s}
.card:hover{box-shadow:0 6px 18px rgba(30,58,95,.12)}
.card:active{transform:scale(.985)}
.card .thumb{aspect-ratio:4/3;height:auto;background:linear-gradient(120deg,#dfe5ec,#eef1f4);position:relative;overflow:hidden}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.srctag{position:absolute;top:8px;left:8px;font-size:11px;padding:3px 8px;border-radius:6px;color:#fff}
.droptag{position:absolute;top:8px;left:8px;transform:translateY(24px);font-size:11px;padding:3px 8px;border-radius:6px;color:#fff;background:var(--red)}
.favheart{position:absolute;top:6px;right:6px;font-size:19px;color:#c94f42;background:rgba(255,255,255,.88);border-radius:50%;
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.favheart.on{color:#e03131}
.chip.more{grid-column:1/-1;width:100%;text-align:center;padding:12px}
.card .body{padding:10px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .t{font-size:14px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.card .meta{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .btm{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;gap:6px}
.price{color:var(--red);font-weight:700;font-size:18px;white-space:nowrap}
.sale{font-size:12px;color:#4a9;white-space:nowrap}

/* ---------- 面板 / 详情 ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.panel h2{font-size:16px;margin-bottom:10px;color:var(--blue);line-height:1.4}
.field{display:flex;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line)}
.field:last-child{border-bottom:none}
.field .k{width:78px;color:var(--muted);flex:0 0 auto}
.field .v{flex:1;word-break:break-word;min-width:0}
.desc{font-size:13px;line-height:1.7;color:#444;margin-top:6px;white-space:pre-wrap;word-break:break-word}
.back{display:inline-block;margin-bottom:10px;font-size:13px;color:var(--accent);padding:6px 2px}
.detail-wrap{min-width:0}
.pricebox{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.pricebox .p{font-size:24px;font-weight:800;color:var(--red)}
.pricebox .p small{font-size:13px;font-weight:600}
.photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:#eef1f4;display:block;margin-bottom:10px}
.btnrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btnrow a,.btnrow button{flex:1 1 auto;text-align:center;border-radius:10px;padding:11px 14px;font-size:14px;border:1px solid var(--line);background:#fff;color:var(--blue)}
.btnrow a.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;white-space:nowrap}
th{background:#eef2f6;color:var(--blue);position:sticky;top:0}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid var(--line)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:#f0f4f9;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.kpi .n{font-size:18px;font-weight:700;color:var(--blue)}
.kpi .n.hl{color:var(--red)}
.kpi .lab{font-size:11px;color:var(--muted);margin-top:2px}
.ybars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:6px;overflow-x:auto;padding-bottom:18px}
.ybar{flex:1;min-width:26px;background:linear-gradient(180deg,#e67e22,#c55a11);border-radius:4px 4px 0 0;position:relative}
.ybar .yl{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
.ybar .yv{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10px;color:#555}
.cmprow input{width:15px;height:15px;accent-color:var(--accent)}
.cmpx{position:fixed;left:12px;right:12px;bottom:calc(var(--navh) + var(--safe) + 8px);z-index:40;max-width:640px;margin:0 auto;
  background:var(--accent);color:#fff;border:none;border-radius:24px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;
  box-shadow:0 4px 14px rgba(230,126,34,.45)}
.cmpbox{overflow-x:auto;-webkit-overflow-scrolling:touch}
.selrow{font-size:13px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin:6px 0;cursor:pointer}
.selrow .pm{color:var(--red);font-weight:700}

/* ---------- 移动端「表格变卡片」共用样式 ---------- */
.rowcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.rowcard.cur{border-color:var(--accent);background:#fff8f2}
.rowcard .rc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.rowcard .rc-t{font-size:13.5px;font-weight:600;line-height:1.4;flex:1;min-width:0}
.rowcard .rc-p{color:var(--red);font-weight:700;font-size:16px;white-space:nowrap}
.rowcard .rc-meta{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.6}
.rowcard .rc-meta b{color:#3a6ea5;font-weight:600}
.rc-check{display:flex;align-items:center;gap:10px}
.rc-check input{width:20px;height:20px;accent-color:var(--accent);flex:0 0 auto}
.tapnote{font-size:11.5px;color:var(--muted);margin-bottom:8px}

/* 回到顶部 */
.totop{position:fixed;right:14px;bottom:calc(var(--navh) + var(--safe) + 66px);z-index:35;width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);background:rgba(255,255,255,.94);color:var(--blue);font-size:18px;display:none;
  align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.14)}
.totop.show{display:flex}

/* ---------- 平板 / 手机（≤900px） ---------- */
@media (max-width:900px){
  .fhead{display:flex;align-items:center;justify-content:space-between;cursor:pointer;flex:1 1 100%;font-size:14px;font-weight:600;color:var(--blue);user-select:none}
  .fhead .fcount{font-size:12px;color:var(--accent);margin-left:6px;font-weight:600}
  .farrow{transition:transform .2s;color:var(--muted);font-size:12px}
  .filters.open .farrow{transform:rotate(180deg)}
  .fbody{display:none}
  .filters.open .fbody{display:flex}
  .fbody select,.fbody input{flex:1 1 calc(50% - 4px);font-size:16px;padding:10px}
  .fbody .chip,.fbody .clearall{flex:1 1 calc(50% - 4px);text-align:center;padding:10px 8px}
  .filters .clearall{margin-left:0}
  .searchbar input{font-size:16px;padding:11px 36px 11px 14px}
  .searchbar button{padding:0 18px}
  .chip{padding:8px 13px}
  .navtab a{padding:10px 0 8px}
  .count{font-size:13px}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .card .t{font-size:13px;min-height:37px}
  .card .body{padding:9px 10px}
  .kpis{grid-template-columns:repeat(3,1fr)}
  .photo{aspect-ratio:4/3}
}
@media (max-width:380px){
  .grid{grid-template-columns:1fr}
  .card .thumb{aspect-ratio:16/9}
  .price{font-size:17px}
  .kpis{grid-template-columns:repeat(2,1fr)}
}

/* ---------- 桌面端（≥901px） ---------- */
@media (min-width:901px){
  body{padding-bottom:0}
  .navtab{display:none}
  .topnav{display:flex}
  .top{padding:12px 22px}
  .searchbar{margin-top:8px;max-width:480px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .detail-wrap{display:grid;grid-template-columns:minmax(360px,5fr) 7fr;gap:16px;align-items:start}
  .detail-wrap .panel{margin-bottom:0}
  .same-panel{position:sticky;top:130px;max-height:calc(100vh - 156px);overflow-y:auto}
  .cmpx{bottom:24px}
  .totop{display:none !important}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<header class="top">
  <div class="hd">
    <div>
      <h1><span class="dot"></span>房车比价通</h1>
      <div class="src-line" id="srcLine">聚合 3 源在售二手房车 · 跨源同款比对</div>
    </div>
    <span class="upd" id="updLabel">更新于 --</span>
  </div>
  <div class="searchbar" id="searchBar">
    <input id="kw" placeholder="搜索：品牌 / 车型 / 关键词" onkeydown="if(event.key==='Enter')applySearch()" oninput="onKwInput()">
    <button class="clr" id="kwClr" onclick="clearKw()" aria-label="清空">✕</button>
    <button onclick="applySearch()">搜索</button>
  </div>
  <nav class="topnav">
    <a href="javascript:void(0)" id="tabTopList" class="active" onclick="switchView('list')">🚐 车源列表</a>
    <a href="javascript:void(0)" id="tabTopCompare" onclick="switchView('compare')">⚖️ 同款比价</a>
  </nav>
</header>

<div class="wrap">
  <div id="srcHealth"></div>
  <div id="kwbar" class="chips" style="display:none"></div>

  <div class="filters" id="filterPanel">
    <div class="fhead" onclick="toggleFilters()">
      <span>🔍 筛选<span class="fcount" id="fCount"></span></span><span class="farrow">▾</span>
    </div>
    <div class="fbody">
    <select id="f_src" onchange="applyFilters()"><option value="">全部来源</option></select>
    <select id="f_type" onchange="applyFilters()"><option value="">全部类型</option></select>
    <select id="f_chassis" onchange="applyFilters()"><option value="">全部底盘品牌</option></select>
    <select id="f_ubrand" onchange="applyFilters()"><option value="">全部上装品牌</option></select>
    <select id="f_year" onchange="applyFilters()"><option value="">全部年份</option></select>
    <input id="f_pmin" type="number" inputmode="decimal" placeholder="最低价(万)" onchange="applyFilters()">
    <input id="f_pmax" type="number" inputmode="decimal" placeholder="最高价(万)" onchange="applyFilters()">
    <select id="f_sort" onchange="applyFilters()">
      <option value="">默认排序</option>
      <option value="price_asc">价格最低</option>
      <option value="price_desc">价格最高</option>
      <option value="year_desc">年份最新</option>
      <option value="newest">最新挂牌</option>
    </select>
    <button id="favBtn" class="chip" onclick="toggleFavOnly(this)">♡ 只看收藏</button>
    <button class="clearall" onclick="clearAll()">✕ 清除全部</button>
    </div>
  </div>

  <!-- 车源列表 -->
  <div id="viewList"><div class="count" id="countLine">加载中…</div><div class="grid" id="gridList"></div></div>

  <!-- 详情 -->
  <div id="viewDetail" style="display:none">
    <a class="back" href="javascript:void(0)" onclick="goList()">← 返回列表</a>
    <div class="detail-wrap">
      <div id="detailBox"></div>
      <div class="panel same-panel"><h2>同款在售对比</h2><div id="sameBox"></div></div>
    </div>

  <!-- 同款比价 -->
  <div id="viewCompare" style="display:none"></div>
</div>

<nav class="navtab">
  <a href="javascript:void(0)" id="tabList" class="active" onclick="switchView('list')"><i>🚐</i>车源</a>
  <a href="javascript:void(0)" id="tabCompare" onclick="switchView('compare')"><i>⚖️</i>同款比价</a>
</nav>
<button class="totop" id="toTop" onclick="scrollTop()" aria-label="回到顶部">↑</button>

<script src="data.js?v=202609180027"></script>
<script>
var DATA=window.RV_DATA||[];
var SRCFRESH=window.RV_SOURCES||{};
var SOURCES={rv28:{name:'房车猫',color:'#3a6ea5'},'21rv':{name:'21世纪房车',color:'#e67e22'},cn2rv:{name:'舒旅二手房车网',color:'#2e9e5b'}};
var state={view:'list',kw:'',f:{src:'',type:'',chassis:'',ubrand:'',year:'',pmin:'',pmax:'',sort:''},sort:'',tid:null};
var cmpSel=[];
var favOnly=false, shown=60, PAGE=60;

/* 小屏判定：≤900px 走"卡片式"，>900px 走表格 */
function isNarrow(){return window.matchMedia('(max-width:900px)').matches}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
/* 老旧 WebView / 无 scrollIntoView 的环境下兜底，避免整段交互中断 */
function scrollInto(el,opt){if(el&&typeof el.scrollIntoView==='function')el.scrollIntoView(opt||{behavior:'smooth'})}
function scrollTop(){try{window.scrollTo({top:0})}catch(e){try{window.scrollTo(0,0)}catch(e2){}}}

function getFavs(){try{return JSON.parse(localStorage.getItem('rv_favs')||'[]')}catch(e){return []}}
function isFav(id){return getFavs().indexOf(id)>=0}
function toggleFav(id,ev){
  if(ev){ev.stopPropagation()}
  var f=getFavs();
  var i=f.indexOf(id);
  if(i>=0)f.splice(i,1);else f.push(id);
  try{localStorage.setItem('rv_favs',JSON.stringify(f))}catch(e){}
  renderList();
}
function toggleFavOnly(el){
  favOnly=!favOnly;
  el.classList.toggle('on',favOnly);
  el.textContent=favOnly?'❤ 只看收藏：开':'♡ 只看收藏';
  renderList();
}
function dropTag(r){
  if(r.first_price&&r.price&&r.first_price>r.price)
    return '<span class="droptag">↓降价'+(r.first_price-r.price).toFixed(1)+'万</span>';
  return '';
}

if(window.RV_UPDATED){document.getElementById('updLabel').textContent='更新于 '+window.RV_UPDATED;}

/* ---------- 数据源健康：把"抓取失败"和"上游停更"讲清楚 ---------- */
function renderSrcHealth(){
  var box=document.getElementById('srcHealth');
  var stale=[],live=[];
  Object.keys(SRCFRESH).forEach(function(k){var v=SRCFRESH[k]||{};(v.stale?stale:live).push([k,v])});
  var line=document.getElementById('srcLine');
  if(line){
    var total=DATA.length;
    var alive=live.map(function(x){return SOURCES[x[0]]?SOURCES[x[0]].name:x[0]});
    line.innerHTML='聚合 '+Object.keys(SRCFRESH).length+' 源 · '+total.toLocaleString('zh-CN')+' 台在售'
      +(alive.length?' · <b>'+alive.join('、')+'</b> 在持续更新':'');
  }
  if(!stale.length){box.innerHTML='';return}
  var dismissed=false;
  try{dismissed=localStorage.getItem('rv_srchealth_off')=== (window.RV_UPDATED||'').slice(0,10)}catch(e){}
  if(dismissed){box.innerHTML='';return}
  var items=stale.map(function(x){
    var k=x[0],v=x[1],nm=(SOURCES[k]||{}).name||k;
    var why;
    if(v.basis==='local'){
      // 源站不给发布时间，只能说清是我们这边多久没收到新车源，不能断言上游停更
      why='源站未提供发布时间，本站已 <b>'+v.stale_days+' 天</b>没有收录到新车源';
    }else{
      why='源站最后一条挂牌 '+esc(v.last_post||'未知')
        +(v.stale_days!=null?('，已 <b>'+v.stale_days+' 天</b>没有新车源'):'');
    }
    return '<li><b>'+nm+'</b>：'+why
      +(v.last_run?('（本站最近巡检 '+esc(v.last_run)+'，抓取正常）'):'')+'</li>';
  }).join('');
  var hasLocal=stale.some(function(x){return (x[1]||{}).basis==='local'});
  var concl=hasLocal
    ? '以上均<b>不是抓取故障</b>。其中标注「源站未提供发布时间」的源，'
      +'是按本站收录时间推断的，也可能只是上游暂时没有新车源；'
      +'本站每次刷新都会巡检，一旦有新挂牌会立刻收录。'
    : '这是<b>源站自己不再发布新车源</b>，不是抓取故障；'
      +'本站仍会在每次刷新时巡检该源，一旦有新挂牌会立刻收录。';
  box.innerHTML='<div class="srchealth"><div class="sh-hd"><div>'
    +'⚠ 有数据源长期没有更新<span class="sh-ok"></span></div>'
    +'<button class="sh-x" onclick="hideSrcHealth()" aria-label="收起">✕</button></div>'
    +'<ul>'+items+'</ul>'
    +'<div class="sh-ok">'+concl+'</div></div>'
    +'<div style="font-size:11.5px;color:var(--muted);margin:-4px 0 10px 2px">'
    +'其余在售车源来自仍在更新的数据源，可正常浏览比价。</div>';
}

function srcName(c){var s=SOURCES[c];return s?s.name:c}
function flat(n){return n==null?'-':n}
function fmtP(p){return p?('¥'+p.toLocaleString('zh-CN',{minimumFractionDigits:1,maximumFractionDigits:1})):'面议'}
function fmtM(km){return km==null?'-':(km>=10000?(km/10000).toFixed(1)+'万公里':km+'公里')}
function srcTag(r){var s=SOURCES[r.source]||{name:r.source,color:'#8a93a3'};return '<span class="srctag" style="background:'+s.color+'">'+s.name+'</span>'}
function rangeYear(r){var y=r.reg_year;if(y)return y;var m=String(r.reg_date).match(/(\d{4})/);return m?+m[1]:null}
function median(a){if(!a.length)return 0;a.sort(function(x,y){return x-y});var i=Math.floor(a.length/2);return a.length%2?a[i]:(a[i-1]+a[i])/2}

function matches(r,f){
  if(favOnly&&!isFav(r.tid))return false;
  if(f.src&&r.source!==f.src)return false;
  if(f.type&&r.rv_type!==f.type)return false;
  if(f.chassis&&r.chassis_brand!==f.chassis)return false;
  if(f.ubrand&&r.brand!==f.ubrand)return false;
  var y=rangeYear(r);
  if(f.year&&(y===null||y!==+f.year))return false;
  if(f.pmin!=='' && (r.price==null||r.price<+f.pmin))return false;
  if(f.pmax!=='' && (r.price!=null&&r.price>+f.pmax))return false;
  if(state.kw){var k=state.kw.toLowerCase();var hay=(r.title+' '+(r.brand||'')+' '+(r.chassis_model||'')).toLowerCase();if(hay.indexOf(k)<0)return false}
  return true;
}
function filtered(){var arr=DATA.filter(function(r){return matches(r,state.f)});var s=state.f.sort;
  if(s==='price_asc')arr.sort(function(a,b){return (a.price||1e9)-(b.price||1e9)});
  else if(s==='price_desc')arr.sort(function(a,b){return (b.price||0)-(a.price||0)});
  else if(s==='year_desc')arr.sort(function(a,b){var d=(rangeYear(b)||0)-(rangeYear(a)||0);return d||((a.price||0)-(b.price||0))});
  else if(s==='newest')arr.sort(function(a,b){var d=String(b.posted_at||'').localeCompare(String(a.posted_at||''));return d||((a.price||0)-(b.price||0))});
  return arr;
}

/* vals=真实取值（如来源代码 rv28），labels=界面显示文案（如"房车猫"）。
   之前这里把 label 当成 option 的 value，导致"来源"筛选拿"房车猫"去比对 source 代码
   "rv28"，永远筛不出结果（看起来就像该数据源一台车都没抓到）。 */
function fillSelect(id,vals,labels,cur){
  var sel=document.getElementById(id),html='<option value="">'+sel.options[0].text+'</option>';
  vals.forEach(function(v,i){var lab=String(labels?labels[i]:v);
    html+='<option value="'+esc(v)+'" '+(cur===String(v)?'selected':'')+'>'+esc(lab)+'</option>';});
  sel.innerHTML=html;
}
function initFilters(){
  var srcs=Object.keys(SOURCES).sort();
  fillSelect('f_src',srcs,srcs.map(srcName),state.f.src);
  var type={},ch={},ub={},yr={};
  DATA.forEach(function(r){if(r.rv_type)type[r.rv_type]=1;if(r.chassis_brand)ch[r.chassis_brand]=1;if(r.brand)ub[r.brand]=1;var y=rangeYear(r);if(y)yr[y]=1});
  fillSelect('f_type',Object.keys(type).sort(),null,state.f.type);
  fillSelect('f_chassis',Object.keys(ch).sort(),null,state.f.chassis);
  fillSelect('f_ubrand',Object.keys(ub).sort(),null,state.f.ubrand);
  fillSelect('f_year',Object.keys(yr).sort(function(a,b){return +b-+a}),null,state.f.year);
  document.getElementById('f_pmin').value=state.f.pmin;
  document.getElementById('f_pmax').value=state.f.pmax;

var cmpSortKey='count';var cmpDir=-1;var cmpG={'cbrand':'','cyear':'','sort':''};var cmpCur=null;
function renderCompare(){
  var groups={};
  DATA.forEach(function(r){if(r.chassis_model&&r.price!=null){groups[r.chassis_model]=groups[r.chassis_model]||[];groups[r.chassis_model].push(r)}});
  var keys=Object.keys(groups);
  keys.sort(function(a,b){var g=groups[a],h=groups[b];
    if(cmpSortKey==='count')return (h.length-g.length)||a.localeCompare(b,'zh');
    var pa=median(g.map(function(x){return x.price})),pb=median(h.map(function(x){return x.price}));
    return (pa-pb)||a.localeCompare(b,'zh');});
  var bm=topUbBrands();
  var html='<div class="panel"><h2>上装品牌速览（按车源数）</h2><div class="kpis">'+
    bm.map(function(b){return '<div class="kpi"><div class="n">'+b.c+'</div><div class="lab">'+esc(b.b)+' · 均价'+b.avg+'万</div></div>'}).join('')+'</div></div>';

  html+='<div class="panel"><h2>同款比价（按底盘型号聚合）</h2>'
    +'<div class="chips">'
    +'<select id="c_sort" onchange="readCmpSort()"><option value="count" '+(cmpSortKey==='count'?'selected':'')+'>按车源数</option><option value="median" '+(cmpSortKey==='median'?'selected':'')+'>按均价</option></select>'
    +'<span style="font-size:12px;color:var(--muted)">点击「型号」进入组内逐项比对</span></div>';
  var rows='';
  if(!keys.length)rows='<tr><td colspan="8">暂无数据</td></tr>';
  keys.forEach(function(m){var a=groups[m],ps=a.map(function(x){return x.price}).sort(function(p,q){return p-q});
    var avg=ps.reduce(function(s,p){return s+p},0)/ps.length,srcs={};a.forEach(function(x){srcs[x.source]=1});
    var ys=a.map(rangeYear).filter(Boolean),mn=ys.length?Math.min.apply(null,ys):0,mx=ys.length?Math.max.apply(null,ys):0;
    if(isNarrow()){
      // 手机：一行一台车型，价格区间代替 4 个价格列
      rows+='<div class="rowcard" onclick="openCmpGroup(\''+esc(m).replace(/'/g,"\\'")+'\')">'
        +'<div class="rc-top"><div class="rc-t">'+esc(m)+' <span style="color:var(--muted);font-weight:400">· '+Object.keys(srcs).length+' 源</span></div>'
        +'<div class="rc-p">'+ps[0].toFixed(1)+'–'+ps[ps.length-1].toFixed(1)+'万</div></div>'
        +'<div class="rc-meta">'+a.length+' 台在售 · 均价 '+avg.toFixed(1)+'万 · 中位 '+median(ps).toFixed(1)+'万'
        +(mn?' · '+(mn===mx?mn:mn+'-'+mx)+'年':'')+'</div></div>';
    }else{
      rows+='<tr><td style="font-weight:600"><a href="javascript:void(0)" onclick="openCmpGroup(\''+m.replace(/'/g,'\\\'')+'\')">'+esc(m)+'</a></td><td>'+a.length+'</td><td>'+(Object.keys(srcs).length)+'</td><td>'+(mn?mn+'-'+mx:'-')+'</td><td>'+ps[0].toFixed(1)+'</td><td>'+avg.toFixed(1)+'</td><td>'+median(ps).toFixed(1)+'</td><td>'+ps[ps.length-1].toFixed(1)+'</td></tr>';
    }
  });
  html+=isNarrow()?rows
    :'<div class="tblwrap"><table><tr><th>底盘型号</th><th>车源</th><th>来源</th><th>年份</th><th>最低(万)</th><th>均价(万)</th><th>中位(万)</th><th>最高(万)</th></tr>'+rows+'</table></div>';
  html+='</div>';
  document.getElementById('viewCompare').innerHTML=html;
}
function readCmpSort(){var sel=document.getElementById('c_sort');if(sel)cmpSortKey=sel.value;renderCompare()}
function topUbBrands(){
  var b={};DATA.forEach(function(r){if(r.brand&&r.price!=null)(b[r.brand]=b[r.brand]||[]).push(r.price)});
  return Object.keys(b).map(function(k){return {b:k,c:b[k].length,avg:(b[k].reduce(function(s,p){return s+p},0)/b[k].length).toFixed(1)}})
    .sort(function(x,y){return y.c-x.c}).slice(0,6);

    +'<select id="cyear" onchange="cmpG.cyear=this.value;renderCmpDetail()"><option value="">全部年份</option>'+ys.map(function(y){return '<option value="'+y+'" '+(cmpG.cyear===String(y)?'selected':'')+'>'+y+'年</option>'}).join('')+'</select>'

    +'</div>'

    +'<div class="kpi"><div class="n">'+med.toFixed(1)+'</div><div class="lab">中位数(万)</div></div>'
    +'<div class="kpi"><div class="n">'+max.toFixed(1)+'</div><div class="lab">最高(万)</div></div>'
    +'<div class="kpi"><div class="n">'+out.length+'</div><div class="lab">筛选后车源</div>'
    +'</div>'
    +'<div class="count" style="margin-bottom:2px">各上牌年份 · 在售车源数</div>'
    +'<div class="ybars">'+(ybars||'<div class="empty">暂无</div>')+'</div>';
  if(isNarrow()){
    html+='<div class="tapnote">勾选 2–3 台，再点右下「对比选中」</div>';
    html+=out.map(function(x){var hl=x.price===min;
      return '<div class="rowcard'+(hl?' cur':'')+'"><div class="rc-check">'
        +'<input type="checkbox" class="cmpchk" data-tid="'+x.tid+'" onchange="toggleCmp(\''+x.tid+'\',this)">'
        +'<div style="flex:1;min-width:0">'
        +'<div class="rc-top"><div class="rc-t">'+esc(x.title)+'</div><div class="rc-p">'+x.price.toFixed(1)+'万</div></div>'
        +'<div class="rc-meta">'+(rangeYear(x)||'-')+'年 · '+fmtM(x.mileage_km)+' · '+esc(x.location||'-')
        +' · <b>'+srcName(x.source)+'</b>'+(hl?' <span style="color:var(--red)">最低价</span>':'')
        +'</div></div></div></div>';
    }).join('')
    +'<div class="count" style="margin-top:8px">勾选 2–3 台点击下方「对比选中」，可逐项并排查看</div>';
  }else{
    html+='<div class="tblwrap"><table><tr><th></th><th>年份</th><th>上装品牌</th><th>里程</th><th>所在地</th><th>价格(万)</th></tr>';
    out.forEach(function(x){var hl=x.price===min?' style="background:#fff3ec"':'';
      html+='<tr'+hl+'><td><input type="checkbox" class="cmpchk" data-tid="'+x.tid+'" onchange="toggleCmp(\''+x.tid+'\',this)"></td><td>'+(rangeYear(x)||'-')+'</td><td>'+esc(x.title)+'</td><td>'+fmtM(x.mileage_km)+'</td><td>'+esc(x.location||'-')+'</td><td style="white-space:nowrap;color:#d23b2e">'+x.price.toFixed(1)+'</td></tr>';
    });
    html+='</table></div>'
      +'<div class="count" style="margin-top:8px">勾选 2–3 台点击下方「对比选中」，可逐项并排查看</div>';
  }
  html+='</div>';
  document.getElementById('viewCompare').innerHTML=html;
}
function toggleCmp(tid,el){
  if(el.checked){if(cmpSel.length>=3){el.checked=false;alert('最多勾选 3 台');return}cmpSel.push(tid)}
  else cmpSel=cmpSel.filter(function(t){return t!==tid});
  var btn=document.getElementById('cmpx');
  if(cmpSel.length){if(!btn){btn=document.createElement('button');btn.id='cmpx';btn.className='cmpx';btn.onclick=openCmpBox;document.body.appendChild(btn)}btn.textContent='对比选中 '+(cmpSel.length)+' 台';btn.style.display=''}
  else if(btn)btn.style.display='none';
}
function openCmpBox(){
  if(cmpSel.length<1)return;
  var list=cmpSel.map(function(t){return DATA.find(function(x){return x.tid===t})}).filter(Boolean);
  var rows=[['来源',function(r){return srcName(r.source)}],['车源',function(r){return r.title}],['上装品牌',function(r){return r.brand||'-'}],['底盘型号',function(r){return r.chassis_model||'-'}],['年份',function(r){return rangeYear(r)||'-'}],['里程',function(r){return fmtM(r.mileage_km)}],['排放',function(r){return r.emission||'-'}],['过户',function(r){return r.transfer_count||'-'}],['类型',function(r){return r.rv_type||'-'}],['所在地',function(r){return r.location||'-'}],['价格',function(r){return '¥'+r.price.toFixed(1)+'万'}]];
  var h;
  if(isNarrow()){
    // 手机：每台车一张卡，逐项列出，避免横向拖 4 列表格
    h=list.map(function(r){return '<div class="rowcard"><div class="rc-top"><div class="rc-t">'+esc(srcName(r.source))+'</div>'
      +'<div class="rc-p">¥'+r.price.toFixed(1)+'万</div></div>'
      +rows.map(function(row){return '<div class="rc-meta">'+row[0]+'：'+esc(row[1](r))+'</div>'}).join('')
      +'</div>'}).join('');
  }else{
    h='<table><tr><th style="background:#fff">字段</th>'+list.map(function(r){return '<th>'+srcName(r.source)+'</th>'}).join('')+'</tr>';
    h+=rows.map(function(row){return '<tr><td style="background:#eef2f6;color:#1e3a5f;font-weight:600">'+row[0]+'</td>'+list.map(function(r){return '<td>'+esc(row[1](r))+'</td>'}).join('')+'</tr>'}).join('')+'</table>';
  }
  var box=document.getElementById('cmpbox');
  if(!box){box=document.createElement('div');box.id='cmpbox';box.className='panel';document.getElementById('viewCompare').appendChild(box)}
  box.innerHTML='<h2 style="font-size:16px;color:#1e3a5f">并排对比</h2><div class="cmpbox">'+h+'</div><div class="chips" style="margin-top:10px"><button class="clearall" onclick="document.getElementById(\'cmpbox\').remove()">关闭对比</button></div>';
  scrollInto(box);
}

function showView(v){
  var isList=(v==='list');
  document.getElementById('viewList').style.display=(isList?'':'none');
  document.getElementById('viewDetail').style.display=(v==='detail'?'':'none');
  document.getElementById('viewCompare').style.display=(v==='compare'?'':'none');
  document.getElementById('searchBar').style.display=(isList?'':'none');
  document.getElementById('kwbar').style.display=(isList?document.getElementById('kwbar').style.display:'none');
  document.getElementById('filterPanel').style.display=(isList?'':'none');
  var srcbox=document.getElementById('srcHealth');
  if(srcbox)srcbox.style.display=(isList?'':'none');
  var fc=document.getElementById('fbodyChips');if(fc&&!isList)fc.style.display='none';
  var act={list:'tabList',compare:'tabCompare'}[v]||'tabList';
  var actTop={list:'tabTopList',compare:'tabTopCompare'}[v]||'tabTopList';
  ['tabList','tabCompare'].forEach(function(id){document.getElementById(id).className=(id===act)?'active':''});
  ['tabTopList','tabTopCompare'].forEach(function(id){var el=document.getElementById(id);if(el)el.className=(id===actTop)?'active':''});
  var navDisp=(v==='detail')?'none':'';
  document.querySelector('.navtab').style.display=navDisp;
  var tn=document.querySelector('.topnav');if(tn)tn.style.display=navDisp;
  var bt=document.getElementById('toTop');if(bt&&v!=='list')bt.classList.remove('show');
}
function switchView(v){
  state.view=v;cmpSel=[];
  var fx=document.getElementById('cmpx');if(fx)fx.style.display='none';
  if(v==='compare')renderCompare();
  showView(v);
  if(v==='list'){initFilters();renderList()}
  scrollTop();
}

/* 回到顶部：仅手机列表页滚动一定距离后出现 */
var toTop=document.getElementById('toTop');
window.addEventListener('scroll',function(){
  if(!toTop)return;
  var on=isNarrow()&&state.view==='list'&&window.scrollY>600;
  toTop.classList.toggle('show',on);
},{passive:true});
/* 屏幕旋转/窗口变化时重绘（表格/卡片切换） */
var lastNarrow=isNarrow();
window.addEventListener('resize',function(){
  var n=isNarrow();
  if(n!==lastNarrow){lastNarrow=n;if(state.view==='compare')renderCompare();else if(state.view==='detail'&&state.tid)openDetail(state.tid);}
});

renderSrcHealth();initFilters();renderList();
</script>
</body>
</html>
