<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>房车比价通 · 二手房车聚合比价</title>
<meta name="description" content="聚合房车猫、21世纪房车、舒旅二手房车网三源在售二手房车，支持筛选、同款比对与品牌速览。">
<style>
:root{
  --blue:#1e3a5f; --accent:#e67e22; --bg:#f4f6f8; --card:#fff;
  --line:#e3e8ee; --text:#222; --muted:#7a8494;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding-bottom:64px}
a{color:inherit;text-decoration:none}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,#1e3a5f,#2c5688);color:#fff;padding:12px 16px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.top .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.top h1{font-size:clamp(17px,4.5vw,22px);font-weight:700;display:flex;align-items:center;gap:8px}
.top h1 .dot{width:9px;height:9px;border-radius:50%;background:#7fd1a0;display:inline-block}
.upd{font-size:11px;background:rgba(255,255,255,.16);padding:4px 9px;border-radius:14px;white-space:nowrap}
.src-line{font-size:12px;opacity:.85;margin-top:4px}
.searchbar{display:flex;gap:8px;margin-top:10px}
.searchbar input{flex:1;border:none;border-radius:20px;padding:9px 14px;font-size:14px;background:#fff;color:#222}
.searchbar button{border:none;border-radius:20px;padding:0 16px;background:var(--accent);color:#fff;font-size:14px}
.navtab{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.navtab a{flex:1;text-align:center;padding:10px 0 8px;font-size:12px;color:var(--muted)}
.navtab a.active{color:var(--accent);font-weight:600}
.navtab a i{display:block;font-style:normal;font-size:19px;line-height:1;margin-bottom:3px}
.wrap{max-width:1200px;margin:0 auto;padding:14px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.filters select,.filters input{font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#333;max-width:100%}
.filters .clearall{margin-left:auto;font-size:12px;border:1px solid #d23b2e;color:#d23b2e;background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
.filters .clearall:active{background:#fdeeea}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{font-size:12px;padding:5px 11px;border:1px solid var(--line);border-radius:20px;background:#fff;color:#555;cursor:pointer}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.count{font-size:12px;color:var(--muted);margin-bottom:10px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:box-shadow .15s}
.card:hover{box-shadow:0 6px 18px rgba(30,58,95,.12)}
.card .thumb{height:120px;background:linear-gradient(120deg,#dfe5ec,#eef1f4);position:relative}
.card .thumb img{width:100%;height:100%;object-fit:cover}
.srctag{position:absolute;top:8px;left:8px;font-size:11px;padding:3px 8px;border-radius:6px;color:#fff}
.droptag{position:absolute;top:8px;left:8px;transform:translateY(24px);font-size:11px;padding:3px 8px;border-radius:6px;color:#fff;background:#d23b2e}
.favheart{position:absolute;top:6px;right:6px;font-size:19px;color:#c94f42;background:rgba(255,255,255,.85);border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.favheart.on{color:#e03131}
.chip.more{width:100%;text-align:center;padding:10px}
.card .body{padding:10px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .t{font-size:14px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.card .meta{font-size:12px;color:var(--muted)}
.card .btm{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.price{color:#d23b2e;font-weight:700;font-size:18px}
.sale{font-size:12px;color:#4a9}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.panel h2{font-size:16px;margin-bottom:10px;color:var(--blue)}
.field{display:flex;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
.field:last-child{border-bottom:none}
.field .k{width:84px;color:var(--muted);flex-shrink:0}
.field .v{flex:1;word-break:break-word}
.desc{font-size:13px;line-height:1.7;color:#444;margin-top:4px;white-space:pre-wrap}
.back{display:inline-block;margin-bottom:10px;font-size:13px;color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;white-space:nowrap}
th{background:#eef2f6;color:var(--blue);position:sticky;top:0}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid var(--line)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:#f0f4f9;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.kpi .n{font-size:18px;font-weight:700;color:var(--blue)}
.kpi .n.hl{color:#d23b2e}
.kpi .lab{font-size:11px;color:var(--muted);margin-top:2px}
.ybars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:6px}
.ybar{flex:1;min-width:20px;background:linear-gradient(180deg,#e67e22,#c55a11);border-radius:4px 4px 0 0;position:relative}
.ybar .yl{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
.ybar .yv{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10px;color:#555}
.cmprow input{width:15px;height:15px;accent-color:var(--accent)}
.cmpx{position:fixed;left:12px;right:12px;bottom:64px;z-index:40;max-width:640px;margin:0 auto;background:var(--accent);color:#fff;border:none;border-radius:24px;padding:11px;font-size:14px;cursor:pointer;box-shadow:0 4px 14px rgba(230,126,34,.4)}
.cmpbox{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cmpbox table{white-space:normal}
.cmpbox td,.cmpbox th{white-space:normal;vertical-align:top;min-width:110px}
.selrow{font-size:13px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin:6px 0;cursor:pointer}
.selrow .pm{color:#d23b2e;font-weight:700}
@media (max-width:560px){
  body{padding-bottom:60px}
  .filters{flex-direction:column}
  .filters .clearall{margin-left:0}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .card .thumb{height:96px}
  .card .t{font-size:13px;min-height:36px}
}
@media (min-width:561px) and (max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<header class="top">
  <div class="hd">
    <div>
      <h1><span class="dot"></span>房车比价通</h1>
      <div class="src-line">聚合 3 源在售二手房车 · 跨源同款比对</div>
    </div>
    <span class="upd" id="updLabel">更新于 --</span>
  </div>
  <div class="searchbar" id="searchBar">
    <input id="kw" placeholder="搜索：品牌 / 车型 / 关键词" onkeydown="if(event.key==='Enter')applySearch()">
    <button onclick="applySearch()">搜索</button>
  </div>
</header>

<div class="wrap">
  <div id="kwbar" class="chips" style="display:none"></div>

  <div class="filters" id="filterPanel">
    <select id="f_src" onchange="applyFilters()"><option value="">全部来源</option></select>
    <select id="f_type" onchange="applyFilters()"><option value="">全部类型</option></select>
    <select id="f_chassis" onchange="applyFilters()"><option value="">全部底盘品牌</option></select>
    <select id="f_ubrand" onchange="applyFilters()"><option value="">全部上装品牌</option></select>
    <select id="f_year" onchange="applyFilters()"><option value="">全部年份</option></select>
    <input id="f_pmin" type="number" placeholder="最低价(万)" onchange="applyFilters()">
    <input id="f_pmax" type="number" placeholder="最高价(万)" onchange="applyFilters()">
    <select id="f_sort" onchange="applyFilters()">
      <option value="">默认排序</option>
      <option value="price_asc">价格最低</option>
      <option value="price_desc">价格最高</option>
      <option value="year_desc">年份最新</option>
    </select>
    <button id="favBtn" class="chip" onclick="toggleFavOnly(this)">♡ 只看收藏</button>
    <button class="clearall" onclick="clearAll()">✕ 清除全部</button>
  </div>

  <!-- 车源列表 -->
  <div id="viewList"><div class="count" id="countLine">加载中…</div><div class="grid" id="gridList"></div></div>

  <!-- 详情 -->
  <div id="viewDetail" style="display:none">
    <a class="back" href="javascript:void(0)" onclick="goList()">← 返回列表</a>
    <div id="detailBox"></div>
    <div class="panel" style="margin-top:14px"><h2>同款在售对比</h2><div id="sameBox"></div></div>
  </div>

  <!-- 同款比价 -->
  <div id="viewCompare" style="display:none"></div>
</div>

<nav class="navtab">
  <a href="javascript:void(0)" id="tabList" class="active" onclick="switchView('list')"><i>🚐</i>车源</a>
  <a href="javascript:void(0)" id="tabCompare" onclick="switchView('compare')"><i>⚖️</i>同款比价</a>
</nav>

<script src="data.js"></script>
<script>
var DATA=window.RV_DATA||[];
var SOURCES={rv28:{name:'房车猫',color:'#3a6ea5'},'21rv':{name:'21世纪房车',color:'#e67e22'},cn2rv:{name:'舒旅二手房车网',color:'#2e9e5b'}};
var state={view:'list',kw:'',f:{src:'',type:'',chassis:'',ubrand:'',year:'',pmin:'',pmax:'',sort:''},sort:'',tid:null};
var cmpSel=[];
var favOnly=false, shown=60, PAGE=60;
function getFavs(){try{return JSON.parse(localStorage.getItem('rv_favs')||'[]')}catch(e){return []}}
function isFav(id){return getFavs().indexOf(id)>=0}
function toggleFav(id,ev){
  if(ev){ev.stopPropagation()}
  var f=getFavs();
  var i=f.indexOf(id);
  if(i>=0)f.splice(i,1);else f.push(id);
  try{localStorage.setItem('rv_favs',JSON.stringify(f))}catch(e){}
  renderList();
}
function toggleFavOnly(el){
  favOnly=!favOnly;
  el.classList.toggle('on',favOnly);
  el.textContent=favOnly?'❤ 只看收藏：开':'♡ 只看收藏';
  renderList();
}
function dropTag(r){
  if(r.first_price&&r.price&&r.first_price>r.price)
    return '<span class="droptag">↓降价'+(r.first_price-r.price).toFixed(1)+'万</span>';
  return '';
}

if(window.RV_UPDATED){document.getElementById('updLabel').textContent='更新于 '+window.RV_UPDATED;}

function srcName(c){var s=SOURCES[c];return s?s.name:c}
function flat(n){return n==null?'-':n}
function fmtP(p){return p?('¥'+p.toLocaleString('zh-CN',{minimumFractionDigits:1,maximumFractionDigits:1})):'面议'}
function fmtM(km){return km==null?'-':(km>=10000?(km/10000).toFixed(1)+'万公里':km+'公里')}
function srcTag(r){var s=SOURCES[r.source]||{name:r.source,color:'#8a93a3'};return '<span class="srctag" style="background:'+s.color+'">'+s.name+'</span>'}
function rangeYear(r){var y=r.reg_year;if(y)return y;var m=String(r.reg_date).match(/(\d{4})/);return m?+m[1]:null}
function median(a){if(!a.length)return 0;a.sort(function(x,y){return x-y});var i=Math.floor(a.length/2);return a.length%2?a[i]:(a[i-1]+a[i])/2}

function matches(r,f){
  if(favOnly&&!isFav(r.tid))return false;
  if(f.src&&r.source!==f.src)return false;
  if(f.type&&r.rv_type!==f.type)return false;
  if(f.chassis&&r.chassis_brand!==f.chassis)return false;
  if(f.ubrand&&r.brand!==f.ubrand)return false;
  var y=rangeYear(r);
  if(f.year&&(y===null||y!==+f.year))return false;
  if(f.pmin!=='' && (r.price==null||r.price<+f.pmin))return false;
  if(f.pmax!=='' && (r.price!=null&&r.price>+f.pmax))return false;
  if(state.kw){var k=state.kw.toLowerCase();var hay=(r.title+' '+(r.brand||'')+' '+(r.chassis_model||'')).toLowerCase();if(hay.indexOf(k)<0)return false}
  return true;
}
function filtered(){var arr=DATA.filter(function(r){return matches(r,state.f)});var s=state.f.sort;
  if(s==='price_asc')arr.sort(function(a,b){return (a.price||1e9)-(b.price||1e9)});
  else if(s==='price_desc')arr.sort(function(a,b){return (b.price||0)-(a.price||0)});
  else if(s==='year_desc')arr.sort(function(a,b){var d=(rangeYear(b)||0)-(rangeYear(a)||0);return d||((a.price||0)-(b.price||0))});
  return arr;
}

function fillSelect(id,vals,labels,cur){
  var sel=document.getElementById(id),html='<option value="">'+sel.options[0].text+'</option>';
  vals.forEach(function(v,i){var t=String(labels?labels[i]:v);html+='<option value="'+t.replace(/"/g,'&quot;')+'" '+(cur===t?'selected':'')+'>'+t+'</option>';});
  sel.innerHTML=html;
}
function initFilters(){
  var srcs=Object.keys(SOURCES).sort();
  fillSelect('f_src',srcs,srcs.map(srcName),state.f.src);
  var type={},ch={},ub={},yr={};
  DATA.forEach(function(r){if(r.rv_type)type[r.rv_type]=1;if(r.chassis_brand)ch[r.chassis_brand]=1;if(r.brand)ub[r.brand]=1;var y=rangeYear(r);if(y)yr[y]=1});
  fillSelect('f_type',Object.keys(type).sort(),null,state.f.type);
  fillSelect('f_chassis',Object.keys(ch).sort(),null,state.f.chassis);
  fillSelect('f_ubrand',Object.keys(ub).sort(),null,state.f.ubrand);
  fillSelect('f_year',Object.keys(yr).sort(function(a,b){return +b-+a}),null,state.f.year);
  document.getElementById('f_pmin').value=state.f.pmin;
  document.getElementById('f_pmax').value=state.f.pmax;
  document.getElementById('f_sort').value=state.f.sort;
}
function readFilters(){
  state.f.src=document.getElementById('f_src').value;
  state.f.type=document.getElementById('f_type').value;
  state.f.chassis=document.getElementById('f_chassis').value;
  state.f.ubrand=document.getElementById('f_ubrand').value;
  state.f.year=document.getElementById('f_year').value;
  state.f.pmin=document.getElementById('f_pmin').value;
  state.f.pmax=document.getElementById('f_pmax').value;
  state.f.sort=document.getElementById('f_sort').value;
}
function applyFilters(){readFilters();renderList()}
function applySearch(){state.kw=document.getElementById('kw').value.trim();renderList()}
function clearAll(){
  state.f={src:'',type:'',chassis:'',ubrand:'',year:'',pmin:'',pmax:'',sort:''};
  state.kw='';document.getElementById('kw').value='';
  initFilters();renderList();
}
function goList(){state.tid=null;switchView('list')}

function renderList(){
  var arr=filtered();
  if(state.tid)shown=PAGE;
  document.getElementById('countLine').textContent='共 '+arr.length+' 台在售'+(SOURCES[state.f.src]?' · 来源 '+SOURCES[state.f.src].name:'')+(favOnly?' · 只看收藏':'');
  var kws=document.getElementById('kwbar');
  if(state.kw){kws.style.display='flex';kws.innerHTML='<span class="chip on" onclick="clearAll()">“'+state.kw+'” ✕</span>';}
  else kws.style.display='none';
  var box=document.getElementById('gridList');
  if(!arr.length){box.innerHTML='<div class="empty">暂无符合条件的车源<div style="margin-top:10px"><button class="clearall" onclick="clearAll()">清除全部筛选</button></div></div>';return}
  var slice=arr.slice(0,shown);
  box.innerHTML=slice.map(function(r){
    var img=r.image_url?'<img src="'+r.image_url+'" loading="lazy" onerror="this.style.display=\'none\'">':'';
    var tags=(r.tags||'').split('、').filter(Boolean).map(function(t){return ' · '+t}).join('');
    var fav=isFav(r.tid);
    return '<div class="card" onclick="openDetail(\''+r.tid+'\')">'
      +'<div class="thumb">'+srcTag(r)+dropTag(r)
      +'<span class="favheart'+(fav?' on':'')+'" onclick="toggleFav(\''+r.tid+'\',event)">'+(fav?'❤':'♡')+'</span>'
      +img+'</div>'
      +'<div class="body"><div class="t">'+r.title+'</div>'
      +'<div class="meta">'+(r.brand||'')+(r.location?' · '+r.location:'')+tags+'</div>'
      +'<div class="btm"><span class="price">'+fmtP(r.price)+'</span><span class="sale">'+flat(rangeYear(r))+'年 · '+fmtM(r.mileage_km)+'</span></div>'
      +'</div></div>';
  }).join('')
  +(arr.length>shown?'<button class="chip more" onclick="shown+='+PAGE+';renderList()">加载更多（还有 '+(arr.length-shown)+' 台）</button>':'');
}

function openDetail(tid){
  var r=DATA.find(function(x){return x.tid===tid});if(!r)return;
  state.tid=tid;state.view='detail';showView('detail');
  var fields=[['来源',srcName(r.source)],['挂牌价',fmtP(r.price)],['上牌年份',rangeYear(r)||'-'],['上牌时间',r.reg_date||'-'],
    ['行驶里程',fmtM(r.mileage_km)],['排放标准',r.emission||'-'],['过户次数',r.transfer_count||'-'],
    ['使用性质',r.usage_type||'-'],['所在地',r.location||'-'],['底盘品牌',r.chassis_brand||'-'],
    ['底盘型号',r.chassis_model||'-'],['上装品牌',r.brand||'-'],['车型类型',r.rv_type||'-']];
  document.getElementById('detailBox').innerHTML='<div class="panel"><h2>'+r.title+'</h2>'+
    fields.map(function(f){return '<div class="field"><span class="k">'+f[0]+'</span><span class="v">'+f[1]+'</span></div>'}).join('')+
    (r.description?'<div class="desc">'+r.description+'</div>':'')+
    (r.url?'<div style="margin-top:10px"><a style="color:#3a6ea5" href="'+r.url+'" target="_blank" rel="noopener">在'+srcName(r.source)+'查看原文 ↗</a></div>':'')+'</div>';
  renderSame(r);
}
function renderSame(cur){
  var cm=cur.chassis_model,box=document.getElementById('sameBox');
  if(!cm){box.innerHTML='<div class="empty">该车未识别出底盘型号，无法聚合同款</div>';return}
  var arr=DATA.filter(function(r){return r.chassis_model===cm&&r.price!=null});
  box.innerHTML='<div class="count" id="sameCount"></div><div class="tblwrap"><table id="sameTbl"></table></div>';
  var ps=arr.map(function(x){return x.price});
  var min=Math.min.apply(null,ps),max=Math.max.apply(null,ps),avg=ps.reduce(function(s,x){return s+x},0)/ps.length;
  document.getElementById('sameCount').textContent='同底盘「'+cm+'」共 '+arr.length+' 台 · 最低 ¥'+min.toFixed(1)+'万 / 均价 ¥'+avg.toFixed(1)+'万 / 最高 ¥'+max.toFixed(1)+'万';
  var s='<tr><th>车源</th><th>来源</th><th>品牌</th><th>年份</th><th>里程</th><th>所在地</th><th>价格(万)</th></tr>';
  arr.sort(function(a,b){return (b.reg_year||0)-(a.reg_year||0)}).forEach(function(x){
    var cls=(x.tid===cur.tid)?' style="background:#fff3ec"':'';
    var t=(x.tid===cur.tid)?x.title+'（当前）':'<a style="color:#1e3a5f" href="javascript:void(0)" onclick="openDetail(\''+x.tid+'\')">'+x.title+'</a>';
    s+='<tr'+cls+'><td>'+t+'</td><td>'+srcName(x.source)+'</td><td>'+(x.brand||'-')+'</td><td>'+(rangeYear(x)||'-')+'</td><td>'+fmtM(x.mileage_km)+'</td><td>'+(x.location||'-')+'</td><td style="white-space:nowrap">'+x.price.toFixed(1)+'万</td></tr>';
  });
  document.getElementById('sameTbl').innerHTML=s;
}

/* ---------- 同款比价（增强） ---------- */
var cmpSortKey='count';var cmpDir=-1;var cmpG={'cbrand':'','cyear':'','sort':''};var cmpCur=null;
function renderCompare(){
  var groups={};
  DATA.forEach(function(r){if(r.chassis_model&&r.price!=null){groups[r.chassis_model]=groups[r.chassis_model]||[];groups[r.chassis_model].push(r)}});
  var keys=Object.keys(groups);
  keys.sort(function(a,b){var g=groups[a],h=groups[b];
    if(cmpSortKey==='count')return (h.length-g.length)||a.localeCompare(b,'zh');
    var pa=median(g.map(function(x){return x.price})),pb=median(h.map(function(x){return x.price}));
    return (pa-pb)||a.localeCompare(b,'zh');});
  var bm=topUbBrands();
  var html='<div class="panel"><h2>上装品牌速览（按车源数）</h2><div class="kpis">'+
    bm.map(function(b){return '<div class="kpi"><div class="n">'+b.c+'</div><div class="lab">'+b.b+' · 均价'+b.avg+'万</div></div>'}).join('')+'</div></div>';

  html+='<div class="panel"><h2>同款比价（按底盘型号聚合）</h2>'
    +'<div class="chips">'
    +'<select id="c_sort" onchange="readCmpSort()"><option value="count" '+(cmpSortKey==='count'?'selected':'')+'>按车源数</option><option value="median" '+(cmpSortKey==='median'?'selected':'')+'>按均价</option></select>'
    +'<span style="font-size:12px;color:var(--muted)">点击「型号」进入组内逐项比对</span></div>'
    +'<div class="tblwrap"><table><tr><th>底盘型号</th><th>车源</th><th>来源</th><th>年份</th><th>最低(万)</th><th>均价(万)</th><th>中位(万)</th><th>最高(万)</th></tr>';
  if(!keys.length)html+='<tr><td colspan="8">暂无数据</td></tr>';
  keys.forEach(function(m){var a=groups[m],ps=a.map(function(x){return x.price}).sort(function(p,q){return p-q});
    var avg=ps.reduce(function(s,p){return s+p},0)/ps.length,srcs={};a.forEach(function(x){srcs[x.source]=1});
    var ys=a.map(rangeYear).filter(Boolean),mn=ys.length?Math.min.apply(null,ys):0,mx=ys.length?Math.max.apply(null,ys):0;
    html+='<tr><td style="font-weight:600"><a href="javascript:void(0)" onclick="openCmpGroup(\''+m.replace(/'/g,'\\\'')+'\')">'+m+'</a></td><td>'+a.length+'</td><td>'+(Object.keys(srcs).length)+'</td><td>'+(mn?mn+'-'+mx:'-')+'</td><td>'+ps[0].toFixed(1)+'</td><td>'+avg.toFixed(1)+'</td><td>'+median(ps).toFixed(1)+'</td><td>'+ps[ps.length-1].toFixed(1)+'</td></tr>';
  });
  html+='</table></div></div>';
  document.getElementById('viewCompare').innerHTML=html;
}
function readCmpSort(){var sel=document.getElementById('c_sort');if(sel)cmpSortKey=sel.value;renderCompare()}
function topUbBrands(){
  var b={};DATA.forEach(function(r){if(r.brand&&r.price!=null)(b[r.brand]=b[r.brand]||[]).push(r.price)});
  return Object.keys(b).map(function(k){return {b:k,c:b[k].length,avg:(b[k].reduce(function(s,p){return s+p},0)/b[k].length).toFixed(1)}})
    .sort(function(x,y){return y.c-x.c}).slice(0,6);
}
function openCmpGroup(m){cmpCur=m;renderCmpDetail()}
function backCmp(){cmpCur=null;renderCompare()}
function renderCmpDetail(){
  var m=cmpCur;var arr=DATA.filter(function(r){return r.chassis_model===m&&r.price!=null});
  cmpSel=[];
  var brands={};arr.forEach(function(r){if(r.brand)brands[r.brand]=1});
  var ys=Array.from(new Set(arr.map(rangeYear).filter(Boolean))).sort(function(a,b){return b-a});
  var keep=function(r){return (!cmpG.cbrand||r.brand===cmpG.cbrand)&&(!cmpG.cyear||rangeYear(r)===+cmpG.cyear)};
  var list=arr.filter(keep);
  var ps=list.map(function(r){return r.price});
  if(ps.length){ps.sort(function(a,b){return a-b});}
  var min=ps.length?ps[0]:0,max=ps.length?ps[ps.length-1]:0,avg=ps.length?ps.reduce(function(s,p){return s+p},0)/ps.length:0,med=median(ps);
  // 年份价格分布柱状
  var ystat={};arr.filter(keep).forEach(function(r){var y=rangeYear(r);if(y){ystat[y]=ystat[y]||[];ystat[y].push(r.price)}});
  var ymax=0;Object.keys(ystat).forEach(function(y){ymax=Math.max(ymax,ystat[y].length)});
  var ybars=Object.keys(ystat).sort(function(a,b){return +b-+a}).map(function(y){var h=ystat[y].length;
    return '<div class="ybar" style="height:'+Math.max(4,Math.round(h/ymax*84))+'px"><span class="yv">'+h+'</span><span class="yl">'+y+'年</span></div>'}).join('');
  // 排序
  var out=list.slice();
  var so=cmpG.sort||'year';
  if(so==='price_asc')out.sort(function(a,b){return a.price-b.price});
  else if(so==='price_desc')out.sort(function(a,b){return b.price-a.price});
  else out.sort(function(a,b){return (b.reg_year||0)-(a.reg_year||0)});

  var html='<a class="back" href="javascript:void(0)" onclick="backCmp()">← 全部车型</a>';
  html+='<div class="panel"><h2>「'+m+'」同款比对</h2>'
    +'<div class="chips">'
    +'<select id="cbrand" onchange="cmpG.cbrand=this.value;renderCmpDetail()"><option value="">全部上装品牌</option>'+Object.keys(brands).sort().map(function(b){return '<option value="'+b+'" '+(cmpG.cbrand===b?'selected':'')+'>'+b+'</option>'}).join('')+'</select>'
    +'<select id="cyear" onchange="cmpG.cyear=this.value;renderCmpDetail()"><option value="">全部年份</option>'+ys.map(function(y){return '<option value="'+y+'" '+(cmpG.cyear===String(y)?'selected':'')+'>'+y+'年</option>'}).join('')+'</select>'
    +'<select id="csort" onchange="cmpG.sort=this.value;renderCmpDetail()"><option value="year" '+(so==='year'?'selected':'')+'>年份新旧</option><option value="price_asc" '+(so==='price_asc'?'selected':'')+'>价格升序</option><option value="price_desc" '+(so==='price_desc'?'selected':'')+'>价格降序</option></select>'
    +'</div>'
    +'<div class="kpis">'
    +'<div class="kpi"><div class="n hl">'+min.toFixed(1)+'</div><div class="lab">最低(万)</div></div>'
    +'<div class="kpi"><div class="n">'+avg.toFixed(1)+'</div><div class="lab">均价(万)</div></div>'
    +'<div class="kpi"><div class="n">'+med.toFixed(1)+'</div><div class="lab">中位数(万)</div></div>'
    +'<div class="kpi"><div class="n">'+max.toFixed(1)+'</div><div class="lab">最高(万)</div></div>'
    +'<div class="kpi"><div class="n">'+out.length+'</div><div class="lab">筛选后车源</div>'
    +'</div>'
    +'<div class="count" style="margin-bottom:2px">各上牌年份 · 在售车源数</div>'
    +'<div class="ybars">'+(ybars||'<div class="empty">暂无</div>')+'</div>'
    +'<div class="tblwrap"><table><tr><th></th><th>年份</th><th>上装品牌</th><th>里程</th><th>所在地</th><th>价格(万)</th></tr>';
  out.forEach(function(x){var hl=x.price===min?' style="background:#fff3ec"':'';
    html+='<tr'+hl+'><td><input type="checkbox" class="cmpchk" data-tid="'+x.tid+'" onchange="toggleCmp(\''+x.tid+'\',this)"></td><td>'+(rangeYear(x)||'-')+'</td><td>'+x.title+'</td><td>'+fmtM(x.mileage_km)+'</td><td>'+(x.location||'-')+'</td><td style="white-space:nowrap;color:#d23b2e">'+x.price.toFixed(1)+'</td></tr>';
  });
  html+='</table></div>'
    +'<div class="count" style="margin-top:8px">勾选 2–3 台点击下方「对比选中」，可逐项并排查看</div>'
    +'</div>';
  document.getElementById('viewCompare').innerHTML=html;
}
function toggleCmp(tid,el){
  if(el.checked){if(cmpSel.length>=3){el.checked=false;alert('最多勾选 3 台');return}cmpSel.push(tid)}
  else cmpSel=cmpSel.filter(function(t){return t!==tid});
  var btn=document.getElementById('cmpx');
  if(cmpSel.length){if(!btn){btn=document.createElement('button');btn.id='cmpx';btn.className='cmpx';btn.onclick=openCmpBox;document.body.appendChild(btn)}btn.textContent='对比选中 '+(cmpSel.length)+' 台';btn.style.display=''}
  else if(btn)btn.style.display='none';
}
function openCmpBox(){
  if(cmpSel.length<1)return;
  var list=cmpSel.map(function(t){return DATA.find(function(x){return x.tid===t})}).filter(Boolean);
  var rows=[['来源',function(r){return srcName(r.source)}],['车源',function(r){return r.title}],['上装品牌',function(r){return r.brand||'-'}],['底盘型号',function(r){return r.chassis_model||'-'}],['年份',function(r){return rangeYear(r)||'-'}],['里程',function(r){return fmtM(r.mileage_km)}],['排放',function(r){return r.emission||'-'}],['过户',function(r){return r.transfer_count||'-'}],['类型',function(r){return r.rv_type||'-'}],['所在地',function(r){return r.location||'-'}],['价格',function(r){return '¥'+r.price.toFixed(1)+'万'}]];
  var h='<table><tr><th style="background:#fff">字段</th>'+list.map(function(r){return '<th>'+srcName(r.source)+'</th>'}).join('')+'</tr>';
  h+=rows.map(function(row){return '<tr><td style="background:#eef2f6;color:#1e3a5f;font-weight:600">'+row[0]+'</td>'+list.map(function(r){return '<td>'+row[1](r)+'</td>'}).join('')+'</tr>'}).join('')+'</table>';
  var box=document.getElementById('cmpbox');
  if(!box){box=document.createElement('div');box.id='cmpbox';box.className='panel';document.getElementById('viewCompare').appendChild(box)}
  box.innerHTML='<h2 style="font-size:16px;color:#1e3a5f">并排对比</h2><div class="cmpbox">'+h+'</div><div class="chips" style="margin-top:10px"><button class="clearall" onclick="document.getElementById(\'cmpbox\').remove()">关闭对比</button></div>';
  box.scrollIntoView({behavior:'smooth'});
}

function showView(v){
  var isList=(v==='list');
  document.getElementById('viewList').style.display=(isList?'':'none');
  document.getElementById('viewDetail').style.display=(v==='detail'?'':'none');
  document.getElementById('viewCompare').style.display=(v==='compare'?'':'none');
  document.getElementById('searchBar').style.display=(isList?'':'none');
  document.getElementById('kwbar').style.display=(isList?document.getElementById('kwbar').style.display:'none');
  document.getElementById('filterPanel').style.display=(isList?'':'none');
  ['tabList','tabCompare'].forEach(function(id){document.getElementById(id).className=(id==='tab'+(v==='detail'?'List':cap(v)))?'active':''});
  document.querySelector('.navtab').style.display=(v==='detail')?'none':'';
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function switchView(v){
  state.view=v;cmpSel=[];
  var fx=document.getElementById('cmpx');if(fx)fx.style.display='none';
  if(v==='compare')renderCompare();
  showView(v);
  if(v==='list'){initFilters();renderList()}
}
initFilters();renderList();
</script>
</body>
</html>
